services:
  frontend:
    build: .

    image: career-companion-frontend

    container_name: career-companion-frontend

    ports:
      - "3001:3000"

    volumes:
      - .:/app
      - /app/node_modules

    environment:
      - NEXT_PUBLIC_API_URL=http://host.docker.internal:3000/api

    command: npm run dev
